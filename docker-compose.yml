services:
  minio:
    image: minio/minio:latest
    container_name: beam-minio
    environment:
      MINIO_ROOT_USER: beamadmin
      MINIO_ROOT_PASSWORD: beamadmin12345
      MINIO_MINFREE: "0"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - ./minio-data:/data
    restart: unless-stopped
