    {% load static %}
    <link rel="stylesheet" href="{% static 'beam/style.css' %}">

    <div class="detail-frame" data-calc-id="{{ calc.id }}">
    <div class="list-header-bar"></div>

    <div class="list-header-row">
        <a href="/"><div class="list-logo" style="background-image: url('{{ MINIO_PUBLIC_BASE_URL }}logo.png');"></div></a>
        <div class="list-title">Рассчёт прочности бетонной балки на изгиб</div>
    </div>

    <div class="detail-card-wrap">
        <div class="detail-card-bg"></div>
        <div class="detail-card-title">Марка бетона: {{ grade.name }}</div>
        <div class="detail-card-image" style="background-image: url('{{ MINIO_PUBLIC_BASE_URL }}{{ grade.image_key }}');"></div>
    <div class="detail-card-desc">{{ grade.description }}<br><strong>Коэффициент прочности:</strong> {{ grade.compressive_strength_mpa }}</div>
                <form method="post" action="{% url 'calc_add' grade.id %}" style="position:absolute; left:250px; bottom:20px; width:160px;">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">
                    <button type="submit" style="all:unset; display:block; text-align:center; width:100%; height:30px; background:#C3C3C3; border:1px solid #000; border-radius:6px; cursor:pointer; font-family:Inter; font-size:12px;">Добавить</button>
                </form>
    </div>
    </div>
